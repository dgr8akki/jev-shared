# Drift check for files copied from https://github.com/dgr8akki/jev-shared.
# This is the consumers' CI job with the drift step appended. Either copy the
# file over .github/workflows/ci.yml or add the last step to your own check
# job after `npm test`: it runs last so a drift failure never hides lint or
# test results. The step reads SHARED.md, fetches each listed file at the
# pinned commit and fails naming every local copy that differs.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint, test and check shared files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

      - name: Shared files match upstream
        run: node scripts/sync-shared.js --check
        env:
          # jev-shared is private for now, so the script needs a token that can read it.
          JEV_SHARED_TOKEN: ${{ secrets.JEV_SHARED_TOKEN }}
        # Remove once the shared repo is public: until then a missing secret would fail every build.
        continue-on-error: true
